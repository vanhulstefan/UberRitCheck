

name: Build Uber Rit Check APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java instellen
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle instellen
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Project uitpakken
        run: |
          mkdir extracted
          unzip -q UberRitCheckAndroid-project.zip -d extracted
          find extracted -maxdepth 3 -type f | head -50
          find extracted -name settings.gradle -o -name settings.gradle.kts

      - name: APK bouwen
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: UberRitCheck-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
