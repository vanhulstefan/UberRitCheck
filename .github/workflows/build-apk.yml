
name: Build Uber Rit Check APK

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java installeren
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle installeren
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bouwpakket uitpakken
        run: |
          unzip -q UberRitCheck-Android-CloudBuild.zip -d package
          PROJECT_ZIP=$(find package -name 'UberRitCheckAndroid-project.zip' | head -1)
          test -n "$PROJECT_ZIP"
          mkdir extracted
          unzip -q "$PROJECT_ZIP" -d extracted

      - name: APK bouwen
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle | head -1)")
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: APK beschikbaar maken
        uses: actions/upload-artifact@v4
        with:
          name: UberRitCheck-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          
